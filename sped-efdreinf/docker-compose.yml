services:
    php:
        build:
            context: .
            dockerfile: Dockerfile.dev
            args:
                PHP_VERSION: "7.4"
        container_name: sped_efdreinf_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ~/projects/sped-efdreinf:/var/www
        networks:
            - proxy

    nginx:
        image: nginx:stable-alpine
        container_name: sped_efdreinf_nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ~/projects/sped-efdreinf:/var/www
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./docker/nginx/default_local.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
        networks:
            - proxy

networks:
  proxy:
    name: proxy
    external: true
