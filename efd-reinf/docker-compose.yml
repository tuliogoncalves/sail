services:
    php:
        build:
            context: .
            dockerfile: Dockerfile.dev
            args:
                PHP_VERSION: "7.4"
        container_name: efd_reinf_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ~/projects/efd_reinf:/var/www
        healthcheck:
            test: ["CMD", "test", "-f", "/var/www/vendor/autoload.php"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 60s
        networks:
            - proxy

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile.dev
            args:
                PHP_VERSION: "7.4"
        container_name: efd_reinf_scheduler
        restart: unless-stopped
        working_dir: /var/www
        entrypoint: ["entrypoint.dev.sh", "php", "artisan", "schedule:work"]
        volumes:
            - ~/projects/efd_reinf:/var/www
        depends_on:
            php:
                condition: service_healthy
        networks:
            - proxy

    nginx:
        image: nginx:stable-alpine
        container_name: efd_reinf_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ~/projects/efd_reinf:/var/www
            - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./docker/nginx/default_local.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            php:
                condition: service_healthy
        networks:
            - proxy

networks:
  proxy:
    name: proxy
    external: true

